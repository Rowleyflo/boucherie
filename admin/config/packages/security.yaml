security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
            cost: 13

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        api:
            pattern: ^/api
            stateless: true
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: admin_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                always_remember_me: false

    role_hierarchy:
        ROLE_BOUCHER: [ROLE_USER]
        ROLE_AGENCE:  [ROLE_BOUCHER, ROLE_USER]

    access_control:
        - { path: ^/admin/login,  roles: PUBLIC_ACCESS }
        - { path: ^/api,          roles: PUBLIC_ACCESS }
        - { path: ^/admin,        roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
