name: Build & Deploy FTP

on:
  push:
    branches:
      - master
      - claude/auto-push-ftp-obHIs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror -R --delete ./dist/ /; bye" \
            sftp://${{ secrets.FTP_SERVER }}
